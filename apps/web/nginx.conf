# Serviço estático do cliente web, com proxy para a API.
#
# O proxy mantém front e API na **mesma origem** do ponto de vista do navegador.
# É o que permite o cookie de sessão funcionar com SameSite=Lax, sem afrouxar
# nada — afrouxar seria trocar segurança por conveniência de infraestrutura.

server {
    listen 8080;
    server_name _;

    # A porta 8080 permite rodar como usuário sem privilégio; portas abaixo de
    # 1024 exigiriam root ou capability extra.

    root /usr/share/nginx/html;
    index index.html;

    # Não anuncia a versão do nginx nas respostas nem nas páginas de erro.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome podem ser cacheados por muito tempo com segurança:
    # mudança de conteúdo muda o nome do arquivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O service worker jamais pode ser cacheado: é ele que controla o cache de
    # todo o resto, e uma versão presa impediria qualquer atualização de chegar.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A API responde na rede interna do Compose. O navegador só enxerga a origem
    # do front, o que preserva o cookie de sessão.
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Não enviamos X-Forwarded-For: a API roda com TRUST_PROXY=false por
        # padrão, e mandar o cabeçalho sem que ela confie nele só criaria a
        # falsa impressão de que o rate limit conta por IP real do cliente.
        proxy_read_timeout 30s;
    }

    # SPA: qualquer rota desconhecida devolve o index, e o roteador do React
    # decide o que renderizar — inclusive a própria página de "não encontrado".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
